<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parku i Lojërave • Shqip</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6eb;color:#243a42;font-family:Arial,sans-serif}header{background:#175b55;color:white;padding:24px 7%;border-bottom:8px solid #f9bc58}h1{font-size:clamp(30px,5vw,52px);margin:0}header p{font-size:19px}main{max-width:1200px;margin:auto;padding:22px}.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:18px;padding:16px;margin:18px 0}button,select{font:inherit;min-height:56px;border-radius:14px;border:0;padding:12px 18px}button{cursor:pointer;touch-action:manipulation;font-weight:bold;background:#e2f0e9;color:#1c5049}select{border:2px solid #adcac3;background:white}button:focus-visible,select:focus-visible{outline:4px solid #b66010;outline-offset:3px}button:disabled{opacity:.7;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.tile{text-align:left;border:3px solid #e3e1d1;border-bottom-width:8px;background:white;padding:24px}.tile:nth-child(3n+2){background:#fff0d1;border-color:#efc686}.tile:nth-child(3n){background:#e7e8ff;border-color:#b5b4ea}.icon{font-size:58px;display:block;margin-bottom:16px}.tile h2{font-size:25px;margin:10px 0}.tile p{line-height:1.5;font-weight:normal}.badge{background:#edf3eb;padding:7px 10px;border-radius:10px;font-size:14px}.panel{background:white;border:3px solid #d9e9e1;border-radius:24px;padding:22px}.scene{background:linear-gradient(#eaf7ff,#f4ffeb);border-radius:20px;padding:22px;text-align:center;min-height:190px;margin:16px 0}.big{font-size:clamp(28px,5vw,48px);font-weight:bold;margin:18px 0}.figures{font-size:45px;line-height:1.8;overflow-wrap:anywhere}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:740px;margin:16px auto}.answers button{font-size:28px;background:#f3ecff;border:3px solid #cfbee9;min-height:80px}.feedback{font-size:22px;font-weight:bold;min-height:40px;margin:16px 0}.right{background:#c4edcd!important}.wrong{background:#ffd4ca!important}.wallet{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.coin{background:#ffe3a0;border:4px solid #ce9c31;border-radius:50%;min-width:76px;height:76px;font-size:24px}.scale{display:flex;align-items:center;justify-content:center;gap:12px;font-size:30px}.pan{border-bottom:9px solid #7753a2;background:#eee5fb;border-radius:15px;padding:20px;min-width:90px}.track{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:18px 0}.cell{border:2px solid #c3d8b5;border-radius:8px;background:#ecf8df;min-height:62px;font-size:22px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap}.palette{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:18px}.selected{outline:4px solid #b15d05}.artgrid{display:grid;gap:3px;margin:20px auto;width:min(100%,480px);aspect-ratio:1}.pixel{padding:0;min-height:0;aspect-ratio:1;border:1px solid #aec3bf;border-radius:4px;background:#fff}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:760px;margin:auto}.card{background:#5768b7;color:white;font-size:30px;min-height:100px}.card.open{background:#fff0bc;color:#263c46}.card.matched{background:#c4edcd;color:#234932}.scores{font-size:21px;font-weight:bold}.note{line-height:1.6;color:#576b70}footer{text-align:center;padding:24px}[hidden]{display:none!important}@media(max-width:600px){main{padding:12px}.panel,.scene{padding:12px}.track{grid-template-columns:repeat(5,1fr)}.memory{gap:6px}.card{font-size:22px;min-height:80px}}
</style></head><body><a href="../index.html" style="display:block;width:max-content;max-width:100%;margin:8px 12px;padding:9px 14px;border-radius:10px;color:#262655;background:#fff;font:700 16px/1.4 system-ui;text-decoration:underline">← Menuja e përbashkët</a><header><h1>🎡 Parku i Lojërave</h1><p>Zbulo • Ndërto • Luaj • Mëso në shqip</p></header><main><div id="catalog"><div class="bar"><label>Niveli: <select id="age"><option value="1">5–6 vjeç · Fillestar</option><option value="2" selected>7–8 vjeç · Mesatar</option><option value="3">9–11 vjeç · Sfidë</option></select></label><button id="full">⛶ Ekran i plotë</button></div><p class="note">🦊 Dhelpra Lira të fton në gjashtë kënde loje! Nivelet janë orientuese; mësuesja zgjedh sipas nxënësve. Gjithçka punon pa internet, me prekje ose maus.</p><div id="tiles" class="grid"></div></div><section id="play" class="panel" hidden><div class="bar"><button id="home">← Kthehu te parku</button><button id="restart">Rifillo ↻</button><span id="score" class="scores"></span></div><h2 id="title"></h2><p id="instruction" class="note"></p><div id="body"></div><p id="feedback" class="feedback" aria-live="polite"></p><button id="next">Sfida tjetër →</button></section></main><footer>Punuar nga Valbona Rama</footer><script>
'use strict';
const $=id=>document.getElementById(id),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function e(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function button(text,fn,cls=''){const b=e('button',cls,text);b.type='button';b.addEventListener('click',fn);return b}
const games=[['shop','🛍️','Dyqani i Lirës','Paguaj me monedha dhe gjej kusurin.','Numra dhe euro'],['balance','⚖️','Peshorja e numrave','Ndërto barazimin që e mban peshoren në ekuilibër.','Barazime'],['pattern','🚂','Treni i modeleve','Gjej vagonin që mungon në vargun me figura ose numra.','Logjikë dhe modele'],['race','🎲','Gara e pyllit','Dy lojtarë hedhin zarin dhe zgjidhin sfida për të ecur.','Dy nxënës me radhë'],['mirror','🦋','Pasqyra me ngjyra','Plotëso figurën simetrike ose krijo artin tënd.','Simetri dhe krijimtari'],['memory','🃏','Kopshti i kujtesës','Hap kartat dhe gjej çiftet e numrave ose veprimeve.','Kujtesë dhe llogaritje']];
const st={key:null,level:2,score:0,round:0,locked:false,correct:null,timers:new Set(),generation:0};
for(const [key,icon,name,desc,badge] of games){const b=button('',()=>open(key),'tile');b.appendChild(e('span','icon',icon));b.appendChild(e('span','badge',badge));b.appendChild(e('h2','',name));b.appendChild(e('p','',desc));$('tiles').appendChild(b)}
function cleanup(){for(const t of st.timers)clearTimeout(t);st.timers.clear();st.generation++}
function delayed(fn,ms){const gen=st.generation;const id=setTimeout(()=>{st.timers.delete(id);if(gen===st.generation)fn()},ms);st.timers.add(id)}
$('home').addEventListener('click',()=>{cleanup();$('play').hidden=true;$('catalog').hidden=false;st.key=null});$('restart').addEventListener('click',()=>open(st.key));$('next').addEventListener('click',round);$('full').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>alert('Përdor F11 për ekran të plotë.'))});
function open(key){cleanup();Object.assign(st,{key,level:Number($('age').value),score:0,round:0,locked:false});$('play').hidden=false;$('catalog').hidden=true;$('title').textContent=games.find(g=>g[0]===key)[1]+' '+games.find(g=>g[0]===key)[2];if(key==='race'){st.positions=[0,0];st.turn=0;st.finished=false}round();$('play').scrollIntoView({block:'start'})}
function score(){ $('score').textContent='⭐ Pikët: '+st.score+(st.key==='race'?' · Radha: '+(st.turn+1):'')}
function feedback(text){$('feedback').textContent=text}
function round(){cleanup();st.round++;st.locked=false;$('body').innerHTML='';feedback('');$('next').hidden=['race','mirror','memory'].includes(st.key);score();({shop,balance,pattern,race,mirror,memory})[st.key]()}
function scene(text){const x=e('div','scene');if(text)x.appendChild(e('div','big',text));$('body').appendChild(x);return x}
function options(parent,c,choices,cb){const grid=e('div','answers');for(const val of shuffle(choices)){let b=button(String(val),()=>{if(st.locked)return;if(val===c){b.classList.add('right');st.locked=true;st.score++;score();feedback('⭐ Saktë! Të lumtë!');if(cb)cb(true)}else{b.classList.add('wrong');b.disabled=true;feedback('🦊 Provo edhe një herë!')}},'');grid.appendChild(b)}parent.appendChild(grid)}
function choices(c){const a=[c];while(a.length<4){const n=Math.max(0,c+rand(-9,9));if(!a.includes(n))a.push(n)}return a}
function shop(){const max=[0,10,30,80][st.level];st.price=rand(2,max);st.paid=0;st.changeMode=st.level===3&&st.round%2===0;const product=shuffle(['🧸','📕','⚽','🎒','🪁'])[0];$('instruction').textContent=st.changeMode?'Lira ka paguar me 100 €. Zgjidh kusurin e saktë.':'Prek monedhat për të paguar shumën e saktë. Mund t’i heqësh të gjitha dhe të provosh sërish.';const box=scene(product+' Çmimi: '+st.price+' €');if(st.changeMode){options(box,100-st.price,choices(100-st.price));return}const amount=e('div','big','Ke vendosur: 0 €');box.appendChild(amount);const wallet=e('div','wallet');for(const value of [1,2,5,10])wallet.appendChild(button(value+' €',()=>{if(st.locked)return;st.paid+=value;amount.textContent='Ke vendosur: '+st.paid+' €';feedback(st.paid>st.price?'Shuma është më e madhe. Hiqi monedhat dhe provo sërish.':'')},'coin'));box.appendChild(wallet);box.appendChild(button('Hiqi monedhat',()=>{if(st.locked)return;st.paid=0;amount.textContent='Ke vendosur: 0 €';feedback('')}));box.appendChild(button('Paguaj ✓',()=>{if(st.locked)return;if(st.paid===st.price){st.locked=true;st.score++;score();feedback('⭐ Pagesë e saktë! Faleminderit!')}else feedback(st.paid<st.price?'Duhen edhe '+(st.price-st.paid)+' €.':'Ke vendosur më shumë se çmimi. Provo sërish.')}))}
function balance(){const max=[0,10,30,100][st.level];let target=rand(2,max),known=rand(0,target);if(st.level===3){known=rand(2,9);const missing=rand(2,9);target=known*missing;st.correct=missing;st.op='×'}else{st.correct=target-known;st.op='+'}$('instruction').textContent='Prek numrat për ta plotësuar kutinë. Peshorja ilustron barazinë e numrave.';const box=scene();const scale=e('div','scale');scale.appendChild(e('div','pan',known+' '+st.op+' □'));scale.appendChild(e('span','','⚖️'));scale.appendChild(e('div','pan',target));box.appendChild(scale);options(box,st.correct,choices(st.correct),()=>{scale.children[0].textContent=known+' '+st.op+' '+st.correct})}
function pattern(){let c,opts;const box=scene();$('instruction').textContent='Vëzhgo rregullin dhe zgjidh vagonin që vjen më pas.';if(st.level===1){const symbols=shuffle(['🐰','🐻','🦊','🐸','🐱']),len=st.round%2?2:3;const sequence=Array.from({length:6},(_,i)=>symbols[i%len]);c=symbols[6%len];opts=symbols.slice(0,4);box.appendChild(e('div','figures',sequence.join(' → ')+' → ❓'))}else{const step=st.level===2?rand(2,5):rand(3,9),start=rand(1,10),multiply=st.level===3&&st.round%2===0;const seq=Array.from({length:5},(_,i)=>multiply?start*2**i:start+i*step);c=multiply?start*32:start+5*step;opts=choices(c);box.appendChild(e('div','big','🚂 '+seq.join(' → ')+' → □'))}st.correct=c;options(box,c,opts)}
function race(){ $('instruction').textContent='Dy lojtarë me radhë: hidhe zarin, pastaj përgjigju. Përgjigjja e saktë të çon përpara me aq hapa sa zari. Përgjigjja e gabuar ia kalon radhën tjetrit. Fiton ai që arrin te 20.';const box=scene();const status=e('div','big',st.finished?'🏆 Gara përfundoi!':(st.turn===0?'🐰 Radha e lepurit':'🦊 Radha e dhelprës'));box.appendChild(status);const track=e('div','track');for(let n=1;n<=20;n++){const cell=e('div','cell',String(n)+(st.positions[0]===n?' 🐰':'')+(st.positions[1]===n?' 🦊':''));track.appendChild(cell)}box.appendChild(track);box.appendChild(e('p','','Nisja: '+(st.positions[0]===0?'🐰 ':'')+(st.positions[1]===0?'🦊':'')+' · Lepuri '+st.positions[0]+'/20 · Dhelpra '+st.positions[1]+'/20'));if(st.finished)return;const throwBtn=button('🎲 Hidhe zarin',()=>{throwBtn.disabled=true;st.die=rand(1,6);feedback('Zari: '+st.die);const max=[0,10,30,100][st.level];let a=rand(0,max),b=rand(0,max-a);if(st.level===3){a=rand(2,9);b=rand(2,9);st.correct=a*b}else st.correct=a+b;const q=e('div','big',a+(st.level===3?' × ':' + ')+b+' = ?');box.appendChild(q);const grid=e('div','answers');for(const val of shuffle(choices(st.correct))){const answer=button(String(val),()=>{if(st.locked)return;st.locked=true;if(val===st.correct){st.positions[st.turn]=Math.min(20,st.positions[st.turn]+st.die);st.score++;feedback('⭐ Ec '+st.die+' hapa!')}else feedback('Përgjigjja ishte '+st.correct+'. Radha kalon.');if(st.positions[st.turn]>=20){st.finished=true;feedback('🏆 Fitoi '+(st.turn===0?'lepuri!':'dhelpra!'))}else st.turn=1-st.turn;score();const nextTurn=button(st.finished?'Shiko fituesin 🏆':'Radha tjetër →',()=>{st.locked=false;$('body').innerHTML='';feedback('');race()});box.appendChild(nextTurn);for(const b of grid.children)b.disabled=true});grid.appendChild(answer)}box.appendChild(grid)});box.appendChild(throwBtn)}
const colors=['#ffffff','#ed6d68','#eebd4a','#54b89b','#5b86d6','#9867c7'];
function mirror(){st.size=st.level===1?6:8;st.paint=1;st.pixels=Array(st.size*st.size).fill(0);st.free=false;const box=scene();$('instruction').textContent='Figura në të majtë është modeli. Zgjidh ngjyrën dhe plotëso anën e djathtë si në pasqyrë. Prek Kontrollo. Ose zgjidh vizatimin e lirë.';for(let r=0;r<st.size;r++)for(let c=0;c<st.size/2;c++)st.pixels[r*st.size+c]=rand(0,st.level===1?2:5);if(!st.pixels.some(Boolean))st.pixels[0]=1;const palette=e('div','palette');colors.forEach((color,i)=>{const b=button(i===0?'Gomë':'Ngjyra '+i,()=>{st.paint=i;for(const p of palette.children)p.classList.remove('selected');b.classList.add('selected')});b.style.backgroundColor=color;if(i===1)b.classList.add('selected');palette.appendChild(b)});box.appendChild(palette);const grid=e('div','artgrid');grid.id='pixels';grid.style.gridTemplateColumns='repeat('+st.size+',1fr)';for(let i=0;i<st.pixels.length;i++){const col=i%st.size,b=button('',()=>{if(st.locked)return;if(!st.free&&col<st.size/2)return;st.pixels[i]=st.paint;b.style.backgroundColor=colors[st.paint]},'pixel');b.style.backgroundColor=colors[st.pixels[i]];if(col===st.size/2)b.style.borderLeft='5px solid #253b42';b.setAttribute('aria-label','Rreshti '+(Math.floor(i/st.size)+1)+', kolona '+(col+1));grid.appendChild(b)}box.appendChild(grid);box.appendChild(button('Kontrollo pasqyrën ✓',()=>{if(st.free){feedback('🎨 Je në vizatim të lirë. Prek Model i ri për sfidë simetrie.');return}if(st.locked)return;let errors=0;for(let r=0;r<st.size;r++)for(let c=0;c<st.size/2;c++)if(st.pixels[r*st.size+c]!==st.pixels[r*st.size+(st.size-1-c)])errors++;if(!errors){st.locked=true;st.score++;score();feedback('🦋 Pasqyrë e saktë! Të lumtë!')}else feedback('Ka edhe '+errors+' katrorë për t’u përputhur. Shiko largësinë nga vija në mes.')}));box.appendChild(button('🎨 Vizatim i lirë',()=>{st.free=true;st.locked=false;feedback('Mund të ngjyrosësh të dyja anët!')}));box.appendChild(button('Model i ri ↻',round))}
function memory(){st.cards=[];st.open=[];st.matches=0;st.busy=false;const used=new Set(),pairs=[];while(pairs.length<6){let a=rand(1,st.level===1?9:12),b=rand(1,9),c=st.level===3?a*b:st.level===2?a+b:a;if(used.has(c))continue;used.add(c);pairs.push([st.level===1?'🍎'.repeat(c):a+(st.level===3?' × ':' + ')+b,String(c)])}st.cards=shuffle(pairs.flatMap((p,id)=>p.map(label=>({id,label,matched:false}))));$('instruction').textContent='Ouvre'.replace('Ouvre','Hap dy karta. Gjej 6 çiftet. Kartat që nuk përputhen mbyllen vetë pas pak.');const grid=e('div','memory');st.cards.forEach((card,i)=>{const b=button('🌸',()=>{if(st.busy||card.matched||st.open.includes(i))return;st.open.push(i);b.textContent=card.label;b.classList.add('open');if(st.open.length===2){const [x,y]=st.open;if(st.cards[x].id===st.cards[y].id){st.matches++;st.score++;score();for(const j of st.open){st.cards[j].matched=true;grid.children[j].disabled=true;grid.children[j].classList.add('matched')}st.open=[];feedback(st.matches===6?'🎉 I gjete të gjashta çiftet!':'⭐ Çift i saktë!')}else{st.busy=true;delayed(()=>{for(const j of st.open){grid.children[j].textContent='🌸';grid.children[j].classList.remove('open')}st.open=[];st.busy=false},1400)}}},'card');grid.appendChild(b)});$('body').appendChild(grid)}
</script></body></html>
